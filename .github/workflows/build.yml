name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach installers to releases on tags

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev cmake
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p hearth-cli
      - name: End-to-end over the real network
        run: python3 scripts/e2e.py target/release/hearth
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-cli-linux
          path: target/release/hearth

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        run: cargo test --workspace
      - name: CLI and node
        run: cargo build --release -p hearth-cli
      - name: End-to-end over the real network
        run: python scripts/e2e.py target/release/hearth.exe
      - name: Desktop installers
        working-directory: crates/hearth-desktop
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-windows
          path: |
            target/release/hearth.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/hearth.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
