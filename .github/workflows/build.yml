name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases on tags

env:
  # Signs desktop updates and CLI binaries. Absent on forks/PRs, where signing is skipped.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev cmake libfuse2t64 xdg-utils
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI lint (undefined/unused names across modules)
        run: crates/hearth-desktop/ui-test/lint.sh
      - name: Desktop UI flows
        run: python3 crates/hearth-desktop/ui-test/run.py
      - run: cargo build --release -p hearth-cli
      - name: End-to-end over the real network
        run: python3 scripts/e2e.py target/release/hearth
      - name: Sound check (people joining, leaving, rejoining, cameras)
        run: python3 scripts/soundcheck.py target/release/hearth
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Desktop AppImage
        working-directory: crates/hearth-desktop
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra="--config tauri.updater.conf.json"; fi
          cargo tauri build --bundles appimage $extra
      - name: Collect
        run: |
          mkdir dist
          cp target/release/hearth dist/hearth-x86_64-unknown-linux-gnu
          cp target/release/bundle/appimage/*.AppImage* dist/
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then cargo tauri signer sign dist/hearth-x86_64-unknown-linux-gnu; fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p hearth-cli
      - name: End-to-end over the real network
        run: python scripts/e2e.py target/release/hearth.exe
      - name: Sound check (people joining, leaving, rejoining, cameras)
        run: python scripts/soundcheck.py target/release/hearth.exe
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Desktop installers
        working-directory: crates/hearth-desktop
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra="--config tauri.updater.conf.json"; fi
          cargo tauri build $extra
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp target/release/hearth.exe dist/hearth-x86_64-pc-windows-msvc.exe
          cp target/release/bundle/nsis/*-setup.exe* target/release/bundle/msi/*.msi* dist/
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then cargo tauri signer sign dist/hearth-x86_64-pc-windows-msvc.exe; fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/

  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Android project
        working-directory: crates/hearth-desktop
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android init --ci
          python3 ../../scripts/android_patch.py gen/android
      - name: Build APK
        working-directory: crates/hearth-desktop
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo tauri android build --apk --target aarch64 --ci
      - name: Sign
        run: |
          mkdir dist
          version=$(python3 -c "import json; print(json.load(open('crates/hearth-desktop/tauri.conf.json'))['version'])")
          unsigned=$(find crates/hearth-desktop/gen/android -name '*release*.apk' | head -1)
          echo "built: $unsigned"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          out="dist/Hearth_${version}_android-arm64.apk"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.jks
            "$tools/apksigner" sign --v4-signing-enabled false --ks release.jks --ks-key-alias hearth --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "$out" aligned.apk
            "$tools/apksigner" verify --print-certs "$out" | grep -i "sha-256"
            rm release.jks
          else
            cp aligned.apk "$out" # unsigned on forks; not installable
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest
        run: python3 scripts/latest_json.py "${GITHUB_REF_NAME}" dist > dist/latest.json && cat dist/latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Hearth ${GITHUB_REF_NAME#v}" --generate-notes
          fi
