[package]
name = "hearth-core"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GPTmadeit/hearth"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
iroh = "1.4.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9"
redb = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
