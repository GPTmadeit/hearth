[package]
name = "hearth-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GPTmadeit/hearth"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hearth-core = { version = "0.1.0", path = "../hearth-core" }
hearth-media = { version = "0.1.0", path = "../hearth-media" }
tokio = { version = "1.54.1", features = ["full"] }

[[bin]]
name = "hearth"
path = "src/main.rs"
