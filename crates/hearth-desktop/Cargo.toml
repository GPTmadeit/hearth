[package]
name = "hearth-desktop"
description = "Hearth desktop app"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GPTmadeit/hearth"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
hearth-core = { path = "../hearth-core" }
hearth-media = { path = "../hearth-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
urlencoding = "2.1.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
