[package]
name = "hearth-desktop"
description = "Hearth desktop app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
hearth-core = { version = "0.1.0", path = "../hearth-core" }
hearth-media = { version = "0.1.0", path = "../hearth-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
tauri-build = "2"
